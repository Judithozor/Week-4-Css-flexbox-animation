<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flexbox Lab - Pricing Plans</title>
<link rel="stylesheet" href="style.css">
</head>
</html>
<body>

    <h1>Pricing Plans</h1>

    <div class="plans">

        <div class="plan">
            <h2>Basic</h2>
            <p class="price">$5<span>/month</span></p>
            <ul>
                <li>1 User</li>
                <li>5GB Storage</li>
                <li>Email Support</li>
            </ul>
            <button>Choose Plan</button>
    </div>

    <div class="plan-featured">
        <h2>Standard</h2>
        <p class="price">$15<span>/month</span></p>
        <ul>
            <li>5 Users</li>
            <li>50GB Storage</li>
            <li>Priority Support</li>
            <li>Custom Domain</li>
        </ul>
        <button>Choose Plan</button>
    </div>

    <div class="plan">
        <h2>Premium</h2>
        <p class="price">$30<span>/month</span></p>
        <ul>
            <li>Unlimited Users</li>
            <li>500GB Storage</li>
            <li>24/7 Support</li>
        </ul>
        <button>Choose Plan</button>
    </div>

    </div>
    
</body>
</html>
